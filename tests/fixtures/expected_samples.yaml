# Hand-derived expected values for the eight sample PEs, for tests/test_rules.py and
# tests/test_baseline.py. Derived on 2026-10-07 by reading the pdftotext .txt files in
# tests/fixtures/samples next to docs/labeling_guide.md; the author should verify every
# line citation against the .txt file before trusting a test that passes.
#
# Each field entry has either `value` or `null` (absent_from_document), plus `line`: the
# 1-based line number(s) of the .txt file where the value is printed, counted on newline
# characters only (sed -n 'N p', or str.split("\n") in Python; never str.splitlines(), which
# also breaks on the form feed at each page boundary). `note` records anything a second
# reader should know. Dates are ISO (YAML parses them to datetime.date), sets are sorted
# lists, dollar amounts are integer dollars, percentages are numbers without the sign.
#
# Applicability nulls follow config/fields.yaml: lending_test_rating is absent on FDIC and
# FRB Small Bank PEs; cd_test_rating is absent on every Small Bank PE.

