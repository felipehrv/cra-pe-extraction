# Section heading patterns per regulator, used by the page-wise locator.
# Patterns are Python regular expressions matched against a stripped line, case-insensitive.
# Lines that look like table-of-contents entries (dot leaders, ellipsis, trailing page
# numbers) are skipped before matching. Seeded from the eight sample PEs on 2026-10-05;
# every pattern must be covered by a test case in tests/test_locate.py.

toc_line_patterns:
  - '\.{4,}\s*[A-Z]?-?\d+\s*$'     # "DESCRIPTION OF INSTITUTION .......... 2"
  - '…{2,}\s*[A-Z]?-?\d+\s*$'      # OCC uses ellipsis characters
  - '^\s*Table of Contents\s*$'

sections:
  cover:
    description: Cover page with agency, institution name, charter or certificate or RSSD number, address, evaluation date.
    scope: institution
    OCC: ['^PUBLIC DISCLOSURE$']
    FDIC: ['^PUBLIC DISCLOSURE$']
    FRB: ['^PUBLIC DISCLOSURE$']
    max_pages: 1

  rating:
    description: The institution's CRA rating statement and, for ISB, the component test ratings.
    scope: institution
    OCC: ["^Overall CRA Rating", "^INSTITUTION'?S CRA RATING", "^This institution is rated"]
    FDIC: ["^INSTITUTION'?S CRA RATING", "^INSTITUTION RATING"]
    FRB: ["^INSTITUTION'?S CRA RATING", "^INSTITUTION RATING"]

  description_of_institution:
    scope: institution
    OCC: ['^Description of Institution']
    FDIC: ['^DESCRIPTION OF INSTITUTION$']
    FRB: ['^DESCRIPTION OF INSTITUTION$']

  description_of_assessment_area:
    scope: institution
    OCC: ['^Description of Assessment Area']
    FDIC: ['^DESCRIPTION OF ASSESSMENT AREAS?$']
    FRB: ['^DESCRIPTION OF ASSESSMENT AREAS?$']

  scope_of_evaluation:
    scope: institution
    OCC: ['^Scope of (the )?Evaluation$']
    FDIC: ['^SCOPE OF EVALUATION$']
    FRB: ['^SCOPE OF EVALUATION$']

  ltd_ratio:
    scope: institution
    OCC: ['^Loan-to-Deposit Ratio$']
    FDIC: ['^Loan-to-Deposit Ratio$']
    FRB: ['^Loan-to-Deposit Ratio$', '^LOAN-TO-DEPOSIT RATIO']

  aa_concentration:
    scope: institution
    OCC: ['^Lending in Assessment Area']
    FDIC: ['^Assessment Area Concentration$']
    FRB: ['^Assessment Area Concentration$', '^LENDING IN (THE )?ASSESSMENT AREA']

  illegal_credit_practices_review:
    description: The fair lending / illegal credit practices review paragraph(s).
    scope: institution
    OCC: ['^Discriminatory or Other Illegal Credit Practices Review']
    FDIC: ['^DISCRIMINATORY OR OTHER ILLEGAL CREDIT PRACTICES REVIEW']
    FRB: ['^FAIR LENDING OR OTHER ILLEGAL CREDIT PRACTICES REVIEW']

# Headings that start a non-institution scope. Any page after one of these and before the
# next institution-level heading inherits the scope.
scope_markers:
  state:
    OCC: ['^State Rating', '^State of ', '^Scope of Evaluation in ']
    FDIC: ['^STATE OF ', "^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN (THE )?STATE OF"]
    FRB: ['^STATE OF ', "^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN (THE )?STATE OF"]
  msa:
    OCC: ['^Multistate Metropolitan', '^MMSA Rating']
    FDIC: ["^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN .*(MSA|MD) "]
    FRB: ["^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN (MSA|MD) "]
  assessment_area:
    OCC: ['^Description of Assessment Area', '^Conclusions .* Assessment Area']
    FDIC: ["^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN .* AA$"]
    FRB: ["^DESCRIPTION OF INSTITUTION'?S OPERATIONS IN "]
  appendix:
    OCC: ['^Appendix [A-D]']
    FDIC: ['^GLOSSARY$', '^APPENDIX']
    FRB: ['^APPENDIX [A-D]', '^Appendix [A-D]']
