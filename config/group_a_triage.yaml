    category: source_error
    error_side: index
    correct_value: isb
    note: >-
      Scope sentence, CD Test rating on p3 ("The Community Development Test is rated
      Satisfactory.") and the appendix heading "INTERMEDIATE SMALL BANK PERFORMANCE CRITERIA"
      all say ISB; the FDIC index says Small Bank.
  - doc_id: OCC_14294_20240708
    field: exam_method
    category: source_error
    error_side: index
    correct_value: isb
    note: >-
      Scope sentence names intermediate small bank procedures and the rating page rates a CD
      Test; the OCC index says Small Bank.
  - doc_id: OCC_18558_20240102
    field: exam_method
    category: source_error
    error_side: index
    correct_value: isb
    note: >-
      The rating page rates both tests; the bank reported $1.53 billion in total assets as of
      December 31, 2022 (p4), inside the ISB band; the OCC index says Small Bank (its prior
      2020 row says Intermediate Small Bank).
  - doc_id: OCC_16625_20231127
    field: exam_method
    category: source_error
    error_side: index
    correct_value: small
    note: >-
      The rating page rates the Lending Test only and the PE reports total assets of $312
      million as of December 31, 2022 (p4), below the 2023 ISB lower threshold of $376
      million; the OCC index says Intermediate Small Bank. Probable index error.
  - doc_id: OCC_15748_20240724
    field: exam_method
    category: source_error
    error_side: index
    correct_value: small
    note: >-
      Seen only with the working-tree locator of 2026-10-08 (the HEAD locator abstains here).
      The Scope sentence names "Small Bank performance criteria and examination procedures"
      (p5), the rating page rates the Lending Test only and the bank reported total assets of
      $192.3 million as of December 31, 2023 (p4); the OCC index says Intermediate Small Bank.
  - doc_id: OCC_10637_20250707
    field: exam_method
    category: definitional
    error_side: none
    correct_value: mixed
    evidence_quote: >-
      The OCC evaluated FNB using Small Bank CRA examination procedures, which included the
      Lending Test, and Intermediate Small Bank CRA examination procedures for the portion of the
      evaluation period from January 1, 2024, through December 31, 2024, which includes the CD
      test.
    page: 5
    note: >-
      Mid-period transition from Small Bank to ISB. The OCC index labels this PE small; the
      same construction is labelled isb for OCC_24219_20250218 and OCC_15698_20240603. The
      0.2.0 rule abstains.
  - doc_id: OCC_24798_20240226
    field: exam_method
    category: definitional
    error_side: none
    correct_value: mixed
    evidence_quote: >-
      The evaluation was conducted using Small Bank CRA examination procedures with Intermediate
      Small Bank CRA performance standards considered for the portion of the evaluation period
      between January 1, 2022, through December 31, 2022.
    page: 5
    note: Mid-period transition; index small. The 0.2.0 rule abstains.

