# Hand triage of Group A disagreements between the rules (S1) and the agency index
# (design section 6.3), read by src/cra_extract/group_a.py.
#
# Categories:
#   our_error     the rule read the wrong thing; correct_value is what the document says
#   source_error  a source is wrong; error_side says which: index (the agency feed) or
#                 document (the PE itself prints a typo or contradicts itself)
#   definitional  both sources are right about different things (the FDIC file-id date is
#                 not the printed evaluation date; a mid-period change of procedures)
#
# Two cases are triaged automatically and are not listed here (see group_a.auto_triage):
# a 0.1.0 disagreement that 0.2.0 resolves to the index value is our_error with the 0.2.0
# quote as evidence, and an FDIC exam_date that differs from the file-id date is
# definitional with the printed cover line as evidence. Every other disagreement needs an
# entry below or the script exits with status 1.
#
# evidence_quote is verbatim from the page text (whitespace collapsed); when it is omitted
# the rules quote of the triaged version is used. Hand-read on 2026-10-08.

entries:
  # ------------------------------------------------------------------ bank_id
  - doc_id: FDIC_33450_20250602
    field: bank_id
    category: source_error
    error_side: document
    correct_value: "33450"
    evidence_quote: "Certificate Number: 34450"
    page: 1
    note: >-
      Cover typo. The FDIC file id (2025/33450_250602.PDF) and the bank's 2019 and 2022 index
      rows (Arbor Bank, Nebraska City NE) all carry certificate 33450.
  - doc_id: FDIC_5981_20240304
    field: bank_id
    category: source_error
    error_side: document
    correct_value: "5981"
    evidence_quote: "Certificate Number: 5891"
    page: 1
    note: >-
      Cover typo (transposed digits). File id 2024/5981_240304.PDF and the 2018 and 2021
      index rows (The Community Bank, Zanesville OH) carry certificate 5981.
  - doc_id: FRB_853112_20220411
    field: bank_id
    category: source_error
    error_side: document
    correct_value: "853112"
    evidence_quote: "RSSD #853113"
    page: 1
    note: >-
      Cover typo. The FRB index lists Heartland Bank under RSSD 853112 for every exam from 1997
      to 2022, and the PDF URL is keyed 853112_20220411.

  # ------------------------------------------------------------------ overall_rating
  - doc_id: FDIC_15701_20241118
    field: overall_rating
    category: source_error
    error_side: index
    correct_value: O
    evidence_quote: "INSTITUTION’S CRA RATING: This institution is rated Outstanding."
    page: 3
    note: >-
      The PE says Outstanding on the rating page and in the conclusions ("The Seymour Bank
      demonstrated outstanding performance under the Lending Test", p7); the FDIC index row
      says Satisfactory.

